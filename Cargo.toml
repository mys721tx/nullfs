[package]
name = "nullfs"
version = "0.1.0"
authors = ["Yishen Miao <mys721tx@gmail.com>"]
description = "A null filesystem"
edition = "2024"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
fuser = "0.19"
clap = { version = "4.6", features = ["cargo"] }

# Unit tests live in the lib/bin; keep them out of `cargo bench`.
[lib]
bench = false

[[bin]]
name = "nullfs"
bench = false

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
libc = "0.2"
tempfile = "3.27"

[[bench]]
name = "ops"
harness = false

[[bench]]
name = "options"
harness = false

[[bench]]
name = "mount"
harness = false
